<meta charset="utf-8" />

<title>👑 Monopoly Legacy</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0;background:#0b0d16;color:#f3e9d2;
    font-family:'Inter',system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid #c9a44a;
    background:linear-gradient(180deg,#2a2418,#1a1610);color:#f0dcae;font-weight:700;
    letter-spacing:.5px;transition:all .15s}
  .btn:hover:not(:disabled){background:linear-gradient(180deg,#3a3020,#2a2418);
    box-shadow:0 0 20px rgba(201,164,74,.35)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#a67a25,#6d4a12);color:#fff5d6}
  .btn.danger{border-color:#d44;color:#fbb}
  input,select{padding:10px 12px;border-radius:8px;border:1px solid #4a4231;
    background:#15141a;color:#f3e9d2;width:100%;font-size:15px;font-family:inherit}
  .card{background:rgba(20,18,28,.9);border:1px solid #3a3324;border-radius:14px;
    padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .row{display:flex;gap:10px}
  .col{display:flex;flex-direction:column;gap:10px}
  .muted{color:#9a8f77;font-size:13px}
  .gold{color:#e9c46a}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#2a2418;
    border:1px solid #4a3f24;font-size:12px}
  .center{display:grid;place-items:center;min-height:100vh;padding:16px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    padding:10px 18px;border-radius:12px;z-index:9999;max-width:90vw}
  code{background:#1a1822;padding:1px 6px;border-radius:4px;font-size:12px}

  /* Board 2D */
  .board-wrap{width:100%;padding:8px;}
  .board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;
    background:#1a1410;border:2px solid #4a3f24;border-radius:8px;padding:4px;
    aspect-ratio:1/1;max-width:520px;margin:0 auto}
  .tile{aspect-ratio:1/1;border-radius:6px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:9px;font-weight:700;
    color:#fff;position:relative;overflow:hidden;transition:all .2s;
    border:1px solid rgba(0,0,0,.4);text-align:center;line-height:1.1;padding:2px}
  .tile .icon{font-size:16px;margin-bottom:2px}
  .tile .name{font-size:8px;opacity:.85;letter-spacing:.3px}
  .tile.city{background:#a2703a}
  .tile.guild{background:#7b3b8a}
  .tile.shop{background:#2e7d5b}
  .tile.wild{background:#8a6d1f}
  .tile.love{background:#a8385c}
  .tile.prison{background:#3a3a44}
  .tile.penampungan{background:#4a3a20}
  .tile.special{background:#2e4a7b}
  .tile .token{position:absolute;bottom:2px;font-size:14px;filter:drop-shadow(0 0 3px #000)}
  .tile .castle{position:absolute;top:1px;right:1px;font-size:12px}
  .tile .owner{position:absolute;top:1px;left:1px;font-size:7px;background:rgba(0,0,0,.5);
    padding:1px 3px;border-radius:3px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.current{box-shadow:0 0 0 2px #e9c46a, 0 0 15px #e9c46a}
</style>

<script type="module">
import React, { useState, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
import { create } from 'zustand';
import htm from 'htm';

const html = htm.bind(React.createElement);

/* ═══════════ Board data ═══════════ */
const CITIES = [
  {id:'ROMA',name:'Roma',price:15000},{id:'POMPEII',name:'Pompeii',price:17000},
  {id:'OSTIA',name:'Ostia',price:19000},{id:'CAPUA',name:'Capua',price:21000},
  {id:'RAVENNA',name:'Ravenna',price:24000},{id:'MEDIOLANUM',name:'Mediolanum',price:27000},
  {id:'NEAPOLIS',name:'Neapolis',price:30000},{id:'VERONA',name:'Verona',price:33000},
  {id:'LONDINIUM',name:'Londinium',price:36000},{id:'EBORACUM',name:'Eboracum',price:39000},
  {id:'CAMULODUNUM',name:'Camulodunum',price:42000},{id:'VENTA_SILURUM',name:'Venta Silurum',price:45000},
  {id:'WINTANCEASTER',name:'Wintanceaster',price:48000},{id:'CANTWARABYRIG',name:'Cantwarabyrig',price:51000},
  {id:'LINDUM_COLONIA',name:'Lindum Colonia',price:54000},{id:'GLEVUM',name:'Glevum',price:57000},
  {id:'HISPALIS',name:'Hispalis',price:60000},{id:'TOLETUM',name:'Toletum',price:63000},
  {id:'CORDUBA',name:'Corduba',price:66000},{id:'EMERITA_AUGUSTA',name:'Emerita Augusta',price:69000},
  {id:'TARRACO',name:'Tarraco',price:72000},{id:'BARCINO',name:'Barcino',price:75000},
  {id:'VALENTIA',name:'Valentia',price:78000},{id:'CAESARAUGUSTA',name:'Caesaraugusta',price:82000},
];
const CITY_BY_ID = Object.fromEntries(CITIES.map(c => [c.id, c]));
const BOARD = [
  {t:'special',n:'START'},{t:'city',id:'ROMA'},{t:'guild'},{t:'love'},
  {t:'city',id:'POMPEII'},{t:'wild'},{t:'shop'},{t:'city',id:'OSTIA'},
  {t:'special',n:'TAX'},{t:'guild'},{t:'city',id:'CAPUA'},{t:'prison'},
  {t:'city',id:'RAVENNA'},{t:'love'},{t:'shop'},{t:'city',id:'MEDIOLANUM'},
  {t:'special',n:'AUCTION'},{t:'city',id:'NEAPOLIS'},{t:'guild'},{t:'wild'},
  {t:'city',id:'VERONA'},{t:'special',n:'FESTIVAL'},{t:'city',id:'LONDINIUM'},{t:'shop'},
  {t:'guild'},{t:'city',id:'EBORACUM'},{t:'love'},{t:'city',id:'CAMULODUNUM'},
  {t:'special',n:'PLAGUE'},{t:'wild'},{t:'city',id:'VENTA_SILURUM'},{t:'prison'},
  {t:'city',id:'WINTANCEASTER'},{t:'guild'},{t:'city',id:'CANTWARABYRIG'},{t:'shop'},
  {t:'city',id:'LINDUM_COLONIA'},{t:'love'},{t:'special',n:'HARVEST'},{t:'city',id:'GLEVUM'},
  {t:'guild'},{t:'wild'},{t:'city',id:'HISPALIS'},{t:'penampungan'},
  {t:'city',id:'TOLETUM'},{t:'shop'},{t:'special',n:'TOURNAMENT'},{t:'city',id:'CORDUBA'},
  {t:'guild'},{t:'city',id:'EMERITA_AUGUSTA'},{t:'love'},{t:'city',id:'TARRACO'},
  {t:'special',n:'ROYAL_COURT'},{t:'wild'},{t:'city',id:'BARCINO'},{t:'guild'},
  {t:'prison'},{t:'city',id:'VALENTIA'},{t:'special',n:'MYSTIC'},{t:'city',id:'CAESARAUGUSTA'},
  {t:'shop'},{t:'special',n:'CAPITAL'},{t:'guild'},{t:'guild'},
];
const ICONS = {city:'🏙️',guild:'⚔️',shop:'🛍️',wild:'🃏',love:'❤️',
  prison:'⛓️',penampungan:'🏚️',special:'❔'};

/* ═══════════ Store ═══════════ */
const useStore = create((set) => ({
  screen:'login', serverOnline:false, user:null, displayName:'',
  room:null, game:null, netStatus:'OFFLINE', ping:0, jitter:0, loss:0,
  adminSession:null, toast:null,
  set:(p)=>set(p), setScreen:(s)=>set({screen:s}), showToast:(t)=>set({toast:t}),
}));

/* ═══════════ Networking ═══════════ */
let WS = null;
const pendingPings = new Map();
const rttSamples = [];
let sentPings = 0, lostPings = 0, pingTimer = null;

function wsUrl() {
  if (location.protocol === 'file:') return 'ws://localhost:4000/ws';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/ws`;
}
function apiUrl(p) {
  if (location.protocol === 'file:') return 'http://localhost:4000' + p;
  return p;
}
function connectWS() {
  if (WS && WS.readyState <= 1) return;
  useStore.getState().set({netStatus:'CONNECTING'});
  WS = new WebSocket(wsUrl());
  WS.onopen = () => {
    useStore.getState().set({netStatus:'CONNECTED'});
    const t = localStorage.getItem('ml_token');
    if (t) send({type:'AUTH', token:t});
    startPing();
  };
  WS.onclose = () => { useStore.getState().set({netStatus:'OFFLINE'}); stopPing(); setTimeout(connectWS, 1500); };
  WS.onerror = () => {};
  WS.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'PONG') return onPong(m);
    handleServer(m);
  };
}
function startPing() {
  stopPing();
  pingTimer = setInterval(() => {
    sentPings++;
    const t0 = performance.now();
    const reqId = Math.random().toString(36).slice(2);
    pendingPings.set(reqId, t0);
    send({type:'PING', t0, reqId});
    setTimeout(() => {
      if (pendingPings.has(reqId)) { pendingPings.delete(reqId); lostPings++; updateLoss(); }
    }, 3000);
  }, 1000);
}
function stopPing() { if (pingTimer) clearInterval(pingTimer); pingTimer = null; }
function onPong(m) {
  const t1 = performance.now();
  const t0 = pendingPings.get(m.reqId);
  if (t0 == null) return;
  pendingPings.delete(m.reqId);
  const rtt = Math.round(t1 - t0);
  rttSamples.push(rtt); if (rttSamples.length > 20) rttSamples.shift();
  const avg = Math.round(rttSamples.reduce((a,b)=>a+b,0) / rttSamples.length);
  const jit = Math.round(Math.sqrt(rttSamples.reduce((s,x)=>s+(x-avg)**2,0) / rttSamples.length));
  useStore.getState().set({
    netStatus: rtt < 100 ? 'REALTIME' : 'CONNECTED',
    ping: avg, jitter: jit,
  });
}
function updateLoss() {
  const loss = sentPings ? (lostPings/sentPings)*100 : 0;
  useStore.getState().set({loss: +loss.toFixed(1)});
}
function send(o) { if (WS && WS.readyState === 1) WS.send(JSON.stringify(o)); }

function handleServer(m) {
  const st = useStore.getState();
  if (m.type === 'AUTH_OK') {
    st.set({user: m.user});
    if (m.user?.mustChangePassword) st.setScreen('password');
  } else if (m.type === 'ERROR') {
    st.showToast({kind:'error', text:`${m.code}: ${m.message}`});
  } else if (m.type === 'ROOM_STATE') {
    st.set({room: m.room});
    if (st.screen === 'mode' || st.screen === 'name') st.setScreen('lobby');
  } else if (m.type === 'GAME_STATE') {
    st.set({game: m.state});
    if (st.screen !== 'game') st.setScreen('game');
  } else if (m.type === 'ACTION_REJECTED') {
    st.showToast({kind:'error', text: m.error.code});
  } else if (m.type === 'ADMIN_OK') {
    st.set({adminSession: {permissions: m.permissions, expiresAt: m.expiresAt}});
    st.showToast({kind:'ok', text:'👑 Admin authorized'});
  }
}
async function checkServer() {
  try {
    const r = await fetch(apiUrl('/api/health'));
    const d = await r.json();
    useStore.getState().set({serverOnline: !!d.ok});
  } catch { useStore.getState().set({serverOnline: false}); }
}

/* ═══════════ Login ═══════════ */
function Login() {
  const [accountName, setAN] = useState(localStorage.getItem('ml_last_user') || 'MUTTAQI2215');
  const [password, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [remember, setRem] = useState(true);
  const [busy, setBusy] = useState(false);
  const st = useStore();

  async function submit(ev) {
    ev.preventDefault();
    if (!accountName || !password) return;
    setBusy(true);
    try {
      const r = await fetch(apiUrl('/api/auth/login'), {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({accountName, password}),
      });
      const data = await r.json();
      if (!r.ok || !data.authenticated) {
        st.showToast({kind:'error', text: data.error === 'SUSPENDED' ? '🔴 ACCOUNT SUSPENDED' : '🔴 INVALID ACCOUNT OR PASSWORD'});
        setBusy(false); return;
      }
      localStorage.setItem('ml_token', data.token);
      if (remember) localStorage.setItem('ml_last_user', accountName);
      send({type:'AUTH', token: data.token});
      st.set({user: data.user});
      st.setScreen('name');
    } catch { st.showToast({kind:'error', text:'Network error'}); }
    setBusy(false);
  }

  return html`
    <div className="center">
      <form onSubmit=${submit} className="card col" style=${{width:380, maxWidth:'100%'}}>
        <div style=${{textAlign:'center', marginBottom:8}}>
          <div style=${{fontSize:44}}>👑</div>
          <h1 style=${{margin:4, fontSize:22, letterSpacing:2, color:'#e9c46a'}}>MONOPOLY LEGACY</h1>
          <div className="muted">Build Your Fortune. Protect Your Legacy.</div>
        </div>
        <hr style=${{borderColor:'#3a3324'}}/>
        <label className="muted">🪪 Account Name</label>
        <input value=${accountName} onInput=${e=>setAN(e.target.value)} autoComplete="username"/>
        <label className="muted">🔑 Password</label>
        <div className="row">
          <input type=${show?'text':'password'} value=${password} onInput=${e=>setPw(e.target.value)} autoComplete="current-password"/>
          <button type="button" className="btn" onClick=${()=>setShow(s=>!s)}>👁️</button>
        </div>
        <label className="muted" style=${{display:'flex', alignItems:'center', gap:8}}>
          <input type="checkbox" style=${{width:'auto'}} checked=${remember} onChange=${e=>setRem(e.target.checked)}/>
          🧠 Remember Account
        </label>
        <button className="btn primary" disabled=${busy} type="submit">🛡️ VERIFY MEMBER</button>
      </form>
    </div>
  `;
}

/* ═══════════ Password change ═══════════ */
function PasswordChange() {
  const [pw1, setPw1] = useState(''); const [pw2, setPw2] = useState('');
  const st = useStore();
  function submit(ev) {
    ev.preventDefault();
    if (pw1.length < 8) return st.showToast({kind:'error', text:'Min 8 characters'});
    if (pw1 !== pw2) return st.showToast({kind:'error', text:'Passwords differ'});
    send({type:'CHANGE_PASSWORD', newPassword: pw1});
    st.showToast({kind:'ok', text:'Password updated'});
    st.setScreen('name');
  }
  return html`
    <div className="center">
      <form onSubmit=${submit} className="card col" style=${{width:380}}>
        <h2 style=${{color:'#e9c46a', margin:0}}>🔐 NEW PASSWORD</h2>
        <input type="password" placeholder="New password" value=${pw1} onInput=${e=>setPw1(e.target.value)}/>
        <input type="password" placeholder="Confirm" value=${pw2} onInput=${e=>setPw2(e.target.value)}/>
        <button className="btn primary" type="submit">SAVE</button>
      </form>
    </div>
  `;
}

/* ═══════════ Display name ═══════════ */
function DisplayName() {
  const [name, setName] = useState('');
  const st = useStore();
  function submit(ev) {
    ev.preventDefault();
    if (name.length < 3 || name.length > 20) return st.showToast({kind:'error', text:'3–20 characters'});
    if (!/^[\p{L}\p{N} _\-'.]+$/u.test(name)) return st.showToast({kind:'error', text:'Invalid characters'});
    st.set({displayName: name, screen:'mode'});
  }
  return html`
    <div className="center">
      <form onSubmit=${submit} className="card col" style=${{width:380}}>
        <div className="muted">Welcome, ${st.user?.accountName}</div>
        <h2 style=${{margin:0, color:'#e9c46a'}}>👑 LEGACY NAME</h2>
        <input value=${name} onInput=${e=>setName(e.target.value)} maxLength=${20} placeholder="e.g. Ragnar"/>
        <button className="btn primary" type="submit">CONTINUE</button>
      </form>
    </div>
  `;
}

/* ═══════════ Mode select ═══════════ */
function ModeSelect() {
  const st = useStore();
  const [code, setCode] = useState('');
  function online(n) {
    send({type:'CREATE_ROOM', mode:'ONLINE_MULTIPLAYER', maxPlayers:n, displayName: st.displayName});
  }
  function bot() {
    send({type:'CREATE_ROOM', mode:'BOT_PRACTICE', displayName: st.displayName});
  }
  function join() {
    if (!code) return st.showToast({kind:'error', text:'Enter room code'});
    send({type:'JOIN_ROOM', displayName: st.displayName, roomCode: code.toUpperCase()});
  }
  return html`
    <div className="center">
      <div className="col" style=${{width:440, maxWidth:'100%'}}>
        <h2 style=${{color:'#e9c46a', textAlign:'center'}}>🎮 SELECT MODE</h2>
        <div className="card col">
          <div style=${{fontWeight:700, color:'#e9c46a'}}>🌐 ONLINE MULTIPLAYER</div>
          <div className="row">
            <button className="btn" onClick=${()=>online(4)}>4 Players</button>
            <button className="btn" onClick=${()=>online(6)}>6 Players</button>
            <button className="btn" onClick=${()=>online(8)}>8 Players</button>
          </div>
        </div>
        <div className="card col">
          <div style=${{fontWeight:700, color:'#e9c46a'}}>🤖 BOT PRACTICE</div>
          <div className="muted">👤 1 HUMAN + 🤖 3 SMART BOTS</div>
          <button className="btn" onClick=${bot}>START BOT PRACTICE</button>
        </div>
        <div className="card col">
          <div style=${{fontWeight:700}}>🔗 JOIN ROOM</div>
          <div className="row">
            <input value=${code} onInput=${e=>setCode(e.target.value.toUpperCase())} placeholder="ROOM CODE" maxLength=${6}/>
            <button className="btn" onClick=${join}>JOIN</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════ Lobby ═══════════ */
function Lobby() {
  const st = useStore();
  const room = st.room;
  if (!room) return html`<div style=${{padding:40}}>Loading...</div>`;
  const isHost = room.hostUserId === st.user.userId;
  const me = room.players.find(p => p.userId === st.user.userId);
  return html`
    <div className="center">
      <div className="card col" style=${{width:520, maxWidth:'100%'}}>
        <div className="row" style=${{justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <div className="muted">${room.mode === 'BOT_PRACTICE' ? '🤖 BOT PRACTICE' : '🌐 ONLINE MULTIPLAYER'}</div>
            <h2 style=${{margin:'4px 0'}}>Room <span className="gold">${room.roomCode}</span></h2>
          </div>
          <div className="pill">${room.players.length} / ${room.maxPlayers}</div>
        </div>
        <div className="col">
          ${room.players.map(p => html`
            <div key=${p.playerId} className="row" style=${{
              justifyContent:'space-between', alignItems:'center', padding:'8px 12px',
              borderRadius:8, background:'#1a1822',
              border: p.userId === st.user.userId ? '1px solid #a67a25' : '1px solid #2a2434',
            }}>
              <div>${p.isBot ? '🤖' : '👤'} <b>${p.displayName}</b>${p.userId === st.user.userId && ' (you)'}</div>
              <div>${p.ready ? '🟢 READY' : '⚪ WAITING'}</div>
            </div>
          `)}
        </div>
        <div className="row">
          <button className="btn" onClick=${()=>send({type:'READY', ready: !me?.ready})}>
            ${me?.ready ? 'UNREADY' : 'READY'}
          </button>
          ${isHost && html`<button className="btn primary" onClick=${()=>send({type:'START_GAME'})}>👑 START GAME</button>`}
        </div>
      </div>
    </div>
  `;
}

/* ═══════════ Board 2D ═══════════ */
function Board2D({ game }) {
  const cityOwners = {};
  for (const c of CITIES) {
    const cs = game.cities?.[c.id];
    if (cs?.ownerId) {
      const o = game.players.find(p => p.playerId === cs.ownerId);
      cityOwners[c.id] = o?.displayName || '?';
    }
  }
  return html`
    <div className="board-wrap">
      <div className="board">
        ${BOARD.map((t, i) => {
          const cs = t.t === 'city' ? game.cities?.[t.id] : null;
          const tokensHere = game.players.filter(p => !p.eliminated && p.position === i);
          const isCurrent = game.players[game.turnIndex]?.position === i;
          const label = t.t === 'city' ? t.id?.split('_')[0]?.slice(0,7) : (t.n || t.t.toUpperCase().slice(0,6));
          return html`
            <div key=${i} className=${`tile ${t.t} ${isCurrent ? 'current' : ''}`} title=${t.id || t.n || t.t}>
              ${cs?.ownerId && html`<div className="owner">${cityOwners[t.id]}</div>`}
              ${cs?.castleLevel > 0 && html`<div className="castle">${'🏰'.repeat(cs.castleLevel)}</div>`}
              <div className="icon">${cs?.hasKingdom ? '👑' : (ICONS[t.t] || '?')}</div>
              <div className="name">${label}</div>
              ${tokensHere.length > 0 && html`
                <div className="token">${tokensHere.map(p => p.isBot ? '🤖' : '🎯').join('')}</div>
              `}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

/* ═══════════ Helpers ═══════════ */
let reqSeq = 0;
const uid = () => `${Date.now().toString(36)}-${(++reqSeq).toString(36)}-${Math.random().toString(36).slice(2,8)}`;
function netLabel(s) {
  return {OFFLINE:'🔴 OFFLINE', CONNECTING:'🟠 RECONNECTING', CONNECTED:'🟡 CONNECTED', REALTIME:'🟢 REAL-TIME'}[s] || s;
}

/* ═══════════ Game screen ═══════════ */
function Game() {
  const st = useStore();
  const game = st.game;
  const [showChron, setShowChron] = useState(false);
  if (!game) return html`<div style=${{padding:40}}>Loading game...</div>`;
  const me = game.players.find(p => p.accountName === st.user?.accountName);
  const cur = game.players[game.turnIndex];
  const isMyTurn = me && cur?.playerId === me.playerId;
  const pd = game.pendingDecision;
  const pendingMine = pd && me && pd.playerId === me.playerId;

  function act(action) {
    send({
      type:'ACTION', requestId: uid(), actionId: uid(),
      gameId: game.gameId, clientStateVersion: game.stateVersion, action,
    });
  }

  return html`
    <div style=${{minHeight:'100vh', paddingBottom:220}}>
      <div style=${{padding:'10px 14px', display:'flex', justifyContent:'space-between', alignItems:'flex-start',
        background:'linear-gradient(180deg,#15141a,#0b0d16)', borderBottom:'1px solid #2a2434'}}>
        <div>
          <div style=${{fontWeight:800, color:'#e9c46a', letterSpacing:2, fontSize:13}}>👑 MONOPOLY LEGACY</div>
          <div className="muted">Round ${game.round} · Turn: <b>${cur?.displayName}</b></div>
        </div>
        <div style=${{textAlign:'right'}}>
          <div className="pill">${netLabel(st.netStatus)} · ${st.ping}ms</div>
          <div className="row" style=${{marginTop:6, justifyContent:'flex-end'}}>
            <button className="btn" onClick=${()=>setShowChron(x=>!x)}>📖</button>
          </div>
        </div>
      </div>

      <${Board2D} game=${game}/>

      <div style=${{
        position:'fixed', bottom:0, left:0, right:0,
        background:'linear-gradient(0deg,#0b0d16,#15141a)',
        padding:12, borderTop:'1px solid #2a2434', zIndex:100,
      }}>
        ${me && html`
          <div className="row" style=${{justifyContent:'space-between', marginBottom:8, flexWrap:'wrap', gap:8, fontSize:12}}>
            <div>
              <b>${me.displayName}</b> · 💰 ${me.cl.toLocaleString()} · ❤️ ${me.hp} · 🔮 ${me.mana} · 🍀 ${me.luck} · 🛡️ ${me.defense}
            </div>
            <div className="pill">🏙️ ${me.ownedCityIds.length} · 🏰 ${me.castles} ${me.hasKingdom ? '· 👑' : ''}</div>
          </div>
        `}

        ${isMyTurn && game.phase === 'AWAIT_ROLL' && html`
          <button className="btn primary" style=${{width:'100%'}} onClick=${()=>act({type:'ROLL_DICE'})}>🎲 ROLL DICE</button>
        `}

        ${pendingMine && pd.type === 'BUY_CITY' && html`
          <div className="row">
            <div style=${{flex:1, fontSize:13}}>🏙️ Beli <b>${pd.cityId}</b> — ${pd.price.toLocaleString()} CL?</div>
            <button className="btn primary" onClick=${()=>act({type:'BUY_CITY'})}>BELI</button>
            <button className="btn" onClick=${()=>act({type:'DECLINE_BUY'})}>SKIP</button>
          </div>
        `}

        ${pendingMine && pd.type === 'UPGRADE_OR_SKIP' && html`
          <div className="row">
            <div style=${{flex:1, fontSize:13}}>⚒️ Upgrade <b>${pd.cityId}</b> — ${pd.upgradeCost.toLocaleString()} CL?</div>
            <button className="btn primary" onClick=${()=>act({type:'UPGRADE_CITY', cityId:pd.cityId})}>UPGRADE</button>
            <button className="btn" onClick=${()=>act({type:'DECLINE_BUY'})}>SKIP</button>
          </div>
        `}

        ${pendingMine && pd.type === 'GUILD' && html`
          <div className="col">
            <div style=${{fontSize:13}}>⚔️ Pilih Guild:</div>
            <div className="row" style=${{flexWrap:'wrap'}}>
              ${pd.guilds.map(g => html`<button key=${g} className="btn" onClick=${()=>act({type:'JOIN_GUILD', guild:g})}>${g}</button>`)}
            </div>
            <div className="row" style=${{flexWrap:'wrap'}}>
              ${pd.armies.map(a => html`
                <button key=${a.tier} className="btn" onClick=${()=>act({type:'BUY_ARMY', tier:a.tier})}>
                  🛡️ ${a.name} — ${a.cost.toLocaleString()}
                </button>
              `)}
            </div>
          </div>
        `}

        ${pendingMine && pd.type === 'SHOP' && html`
          <div className="col">
            <div style=${{fontSize:13}}>🛍️ Mercy Shop:</div>
            <div className="row" style=${{flexWrap:'wrap'}}>
              ${pd.items.map(i => html`<button key=${i.id} className="btn" onClick=${()=>act({type:'BUY_ITEM', itemId:i.id})}>${i.name} (${i.price})</button>`)}
              <button className="btn" onClick=${()=>act({type:'DECLINE_BUY'})}>LEAVE</button>
            </div>
          </div>
        `}

        ${pendingMine && pd.type === 'WILD_CARD' && html`
          <div className="col">
            <div style=${{fontSize:13}}>🃏 Pilih Wild Card:</div>
            <div className="row" style=${{flexWrap:'wrap'}}>
              ${pd.cards.map(c => html`
                <button key=${c.id} className="btn" onClick=${()=>act({type:'CHOOSE_WILD_CARD', cardId:c.id})}>${c.name}</button>
              `)}
            </div>
          </div>
        `}

        ${isMyTurn && game.phase === 'END_TURN' && !pendingMine && html`
          <button className="btn" onClick=${()=>act({type:'END_TURN'})}>➡️ END TURN</button>
        `}

        ${!isMyTurn && game.phase !== 'FINISHED' && html`
          <div className="muted" style=${{textAlign:'center'}}>Menunggu ${cur?.displayName}…</div>
        `}

        ${game.phase === 'FINISHED' && game.winner && html`
          <div className="card" style=${{textAlign:'center'}}>
            <div style=${{fontSize:32}}>🏆</div>
            <h3 style=${{margin:0, color:'#e9c46a'}}>${game.winner.displayName} MENANG!</h3>
            <div className="muted">Legacy: ${game.winner.value.toLocaleString()}</div>
          </div>
        `}
      </div>

      ${showChron && html`
        <div className="card" style=${{position:'fixed', right:8, top:60, width:280, maxHeight:'60vh', overflow:'auto', zIndex:200}}>
          <div className="row" style=${{justifyContent:'space-between'}}>
            <b>📖 Chronicle</b>
            <button className="btn" onClick=${()=>setShowChron(false)}>✕</button>
          </div>
          ${game.chronicle.slice().reverse().slice(0,30).map((c, i) => html`
            <div key=${i} className="muted" style=${{marginTop:6, fontSize:11}}>R${c.round}: ${c.text}</div>
          `)}
        </div>
      `}
    </div>
  `;
}

/* ═══════════ App ═══════════ */
function App() {
  const st = useStore();
  useEffect(() => {
    checkServer();
    connectWS();
    const iv = setInterval(checkServer, 5000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (!st.toast) return;
    const t = setTimeout(() => useStore.getState().set({toast:null}), 3500);
    return () => clearTimeout(t);
  }, [st.toast]);

  if (!st.serverOnline) {
    return html`
      <div className="center">
        <div className="card col" style=${{width:380, textAlign:'center'}}>
          <div style=${{fontSize:44}}>👑</div>
          <h2 style=${{color:'#e9c46a', margin:0}}>MENGHUBUNGI SERVER…</h2>
          <div className="muted">Menunggu server Railway aktif. Kalau sudah lama, refresh halaman.</div>
          <button className="btn" onClick=${checkServer}>🔄 COBA LAGI</button>
        </div>
      </div>
    `;
  }

  return html`
    ${st.screen === 'login' && html`<${Login}/>`}
    ${st.screen === 'password' && html`<${PasswordChange}/>`}
    ${st.screen === 'name' && html`<${DisplayName}/>`}
    ${st.screen === 'mode' && html`<${ModeSelect}/>`}
    ${st.screen === 'lobby' && html`<${Lobby}/>`}
    ${st.screen === 'game' && html`<${Game}/>`}
    ${st.toast && html`
      <div className="toast" style=${{
        background: st.toast.kind === 'error' ? '#4a1a1a' : '#1a3a1a',
        border: `1px solid ${st.toast.kind === 'error' ? '#a44' : '#4a4'}`,
      }}>${st.toast.text}</div>
    `}
  `;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
